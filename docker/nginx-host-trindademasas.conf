# Host Nginx reverse proxy for the Docker web service.
# Install as /etc/nginx/sites-available/trindademasas.duckdns.org
server {
    listen 80;
    listen [::]:80;
    server_name trindademasas.duckdns.org;

    # The Aero bridge returns through a GET whose `aero_data` carries the ERP's whole answer URL-encoded, and a
    # day of movements is tens of kilobytes of JSON inflated again by `encodeURIComponent`. Without these buffers
    # this proxy is the one that answers `414 Request-URI Too Large` before the app's own nginx ever sees it.
    client_header_buffer_size 32k;
    large_client_header_buffers 8 256k;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
