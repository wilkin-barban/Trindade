server {
    listen 80;
    server_name _;

    # `Server: nginx` instead of `Server: nginx/1.27.5`. The image version is pinned in the Dockerfile and in
    # the repository; the public response does not have to hand an attacker the exact version to look up.
    server_tokens off;

    client_max_body_size 10M;
    large_client_header_buffers 4 64k;

    # ---- Compression ----
    # The Vite entry bundle is ~519 kB of source (~161 kB gzipped) and the export vendor ~594 kB, and the plant
    # network is the slow link. `text/html` is always compressed by nginx, so it is not in the list.
    # `gzip_proxied any` covers the API JSON that arrives through `proxy_pass`; `gzip_vary` stops a shared cache
    # from serving the compressed body to a client that did not ask for it. Brotli is not enabled: the official
    # `nginx:alpine` image does not ship `ngx_brotli`, and this repository does not add modules to it.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---- Security headers ----
    # This one server block is the whole public surface: static assets, the SPA fallback, the proxied API and the
    # proxy's own error pages. Declaring the policy here reaches all of them (nginx does add these to proxied
    # responses), and `always` keeps them on 4xx/5xx too. They are NOT declared in the API as well on purpose:
    # nginx appends a repeated header, and `X-Frame-Options: DENY, DENY` or `nosniff, nosniff` is not a value
    # any browser accepts, so duplicating them would weaken the protection instead of reinforcing it.
    #
    # CSP is checked against what the app really does: the bundle has no inline script and no eval (so
    # `script-src 'self'`), Tailwind ships one stylesheet plus style attributes (so `style-src` needs
    # 'unsafe-inline'), QR codes are data URLs and photo previews are blob URLs (so `img-src` needs both),
    # every request is same-origin (`connect-src 'self'`), there is no web font and no <object>, and the
    # WhatsApp/App Store links are navigations, which CSP does not restrict.
    #
    # `add_header` is NOT inherited by a location that declares its own: keep the block below identical in
    # `location /assets/` and `location /`.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # A policy of our own, so the document does not carry feature names Chrome no longer recognises
    # (run-ad-auction, join-ad-interest-group) or whatever a future dependency decides to inject. Only
    # the three capabilities this application never asks for are denied; anything unlisted stays at the
    # browser default.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ---- API reverse proxy ----
    # No `Cache-Control` here: the API owns it (it answers `no-store` for everything it serves and each public
    # photo route still declares its own value), so the policy survives any deployment behind this proxy.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass original Authorization header to the API
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
    }

    # ---- Shortened public links proxy ----
    location /p/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Hashed assets ----
    # Vite names these after their content, so a cached copy can never be stale; a missing file is a 404 and must
    # not fall back to the SPA.
    location /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # ---- Static frontend and SPA fallback ----
    # The shell names the current hashed bundle, so a cached copy would pin the app to assets that no longer
    # exist. `no-cache` still allows the conditional request, so an unchanged shell costs a 304.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}
